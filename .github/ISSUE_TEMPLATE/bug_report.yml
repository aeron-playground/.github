name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here. Follow the [security policy](https://github.com/aeron-playground/.github/blob/main/SECURITY.md) instead.
        Never share passwords, private keys or access tokens in an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you used.
      placeholder: v1.2.0, or commit 1a2b3c4

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and the browser or runtime if it matters.
      placeholder: Firefox 142 on Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: This report has no passwords, private keys or tokens in it.
          required: true
